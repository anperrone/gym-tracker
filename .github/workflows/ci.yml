name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + formatting + typecheck + test unit/integrazione
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # `check` include il coverage gate (≥80% su logica server + shared): fallisce sotto soglia.
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Pipeline E2E (Playwright/Chromium) — job separato
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploy su Cloudflare: solo su push a main, se check + e2e sono verdi.
  # Attivare impostando la variabile repo DEPLOY_ENABLED=true dopo aver configurato i secret.
  deploy:
    needs: [check, e2e]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Migrazioni D1 (remote)
        run: npx wrangler d1 migrations apply gym-tracker-db --remote

      - name: Build
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy -c dist/gym_tracker/wrangler.json

      # Sincronizza i secret del Worker dai GitHub Secrets.
      - name: Push secrets del Worker
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          printf '%s' "$GOOGLE_CLIENT_ID"     | npx wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$GOOGLE_REDIRECT_URI"  | npx wrangler secret put GOOGLE_REDIRECT_URI
          printf '%s' "$ADMIN_EMAILS"         | npx wrangler secret put ADMIN_EMAILS
